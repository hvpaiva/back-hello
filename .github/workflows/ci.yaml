# hello's CI: its own tests, then the platform's delivery workflow, which
# validates charts/hello and ships it (staging builds and deploys, main
# promotes). The delivery logic lives in the lab repository, so every service
# gets the same behavior and a fix reaches them all at once.
name: ci

on:
  push:
    branches: [main, staging]
  pull_request:

permissions: {}

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  delivery:
    needs: test
    uses: hvpaiva/back/.github/workflows/service.yaml@main
    with:
      service: hello
    permissions:
      contents: write
      packages: write
