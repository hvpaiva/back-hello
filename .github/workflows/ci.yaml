name: ci

on:
  push:
    branches: [main, staging]
  pull_request:
  # Builds and ships the branch as it stands, without waiting for a change to it.
  workflow_dispatch:

permissions: {}

jobs:
  test:
    uses: hvpaiva/back/.github/workflows/service-go.yaml@main
    permissions:
      contents: read

  delivery:
    needs: test
    uses: hvpaiva/back/.github/workflows/service-delivery.yaml@main
    with:
      service: hello
    permissions:
      contents: write
      packages: write
