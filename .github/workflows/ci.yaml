# hello's CI is two workflows the platform provides in the lab repository:
# the checks for Go services, then delivery, which validates charts/hello and
# ships it (staging builds and deploys, main promotes). Every service gets the
# same behavior, and a fix reaches them all at once.
name: ci

on:
  push:
    branches: [main, staging]
  pull_request:

permissions: {}

jobs:
  test:
    uses: hvpaiva/back/.github/workflows/go.yaml@main
    permissions:
      contents: read

  delivery:
    needs: test
    uses: hvpaiva/back/.github/workflows/delivery.yaml@main
    with:
      service: hello
    permissions:
      contents: write
      packages: write
